services:
  clearchange_db:
    image: mysql:8.0
    container_name: clearchange-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: clearchange
      MYSQL_USER: clearchange
      MYSQL_PASSWORD: password
    ports:
      - "3309:3306"
    volumes:
      - clearchange_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  clearchange_app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: clearchange-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    environment:
      - DB_HOST=clearchange_db
      - DB_PORT=3306
      - DB_DATABASE=clearchange
      - DB_USERNAME=clearchange
      - DB_PASSWORD=password
      - LOG_CHANNEL=daily
      - LOG_DEPRECATIONS_CHANNEL=null
      - LOG_LEVEL=debug
    depends_on:
      clearchange_db:
        condition: service_healthy

  clearchange_queue:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: clearchange-queue
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    environment:
      - DB_HOST=clearchange_db
      - DB_DATABASE=clearchange
      - DB_USERNAME=clearchange
      - DB_PASSWORD=password
      - QUEUE_CONNECTION=database
    command: php artisan queue:listen --verbose --tries=3 --timeout=90
    depends_on:
      clearchange_db:
        condition: service_healthy
      clearchange_app:
        condition: service_started
    profiles:
      - with-queue

  clearchange_web:
    image: nginx:alpine
    container_name: clearchange-web
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www/html:ro
    ports:
      - "8082:80"
    depends_on:
      - clearchange_app

  clearchange_node:
    image: node:20-alpine
    container_name: clearchange-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "5175:5175"
    environment:
      - VITE_DEV_SERVER_HOST=0.0.0.0
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5175"
    depends_on:
      - clearchange_app

volumes:
  clearchange_db:
